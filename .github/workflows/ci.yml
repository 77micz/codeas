name: Node.js CI

on:
  # 触发条件：推送事件或拉取请求事件
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 拉取代码

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 设置 Node.js 环境
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 安装依赖

      - name: Type check
        run: npm run typecheck # 类型检查

      - name: Build project
        run: npm run build # 构建项目

      - name: Run tests
        run: npm test # 运行测试